name: "(CI): Verify Build And Plan"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  continuos-integration:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_URL: "https://capivara-solidaria.com.br"
      API_BASE_URL: "https://api.capivara-solidaria.com.br/"
      API_KEY: "dummy"
      NEXT_PUBLIC_POSTHOG_KEY: "dummy"
      NEXTAUTH_URL: "https://capivara-solidaria.com.br"
      NEXTAUTH_URL_INTERNAL: "https://capivara-solidaria.com.br"
      NEXTAUTH_SECRET: "dummy"
      GOOGLE_CLIENT_ID: "dummy"
      GOOGLE_CLIENT_SECRET: "dummy"
      JWT_SECRET: "dummy"
      OPENAI_API_KEY: "dummy"
      OPENAI_ORGANIZATION_ID: "dummy"
      OPENAI_PROJECT_ID: "dummy"
      WORDPRESS_BASE_URL: "https://public-api.wordpress.com/wp/v2/sites/frontendl2429yyi8vitingrsprojectsvercel.wordpress.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CODEARTIFACT_READ_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get CodeArtifact token
        shell: bash
        run: |
          echo "CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain npm \
            --domain-owner 412898606600 \
            --region us-east-1 \
            --query authorizationToken \
            --output text)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Unit Tests
        run: pnpm test:run

      - name: Run Build
        run: |
          pnpm run build
